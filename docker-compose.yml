services:
  db:
    image: mariadb:11
    container_name: bmi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Test12
      MYSQL_DATABASE: bmi_localization
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    image: abdullah22hel/bmi_cal:latest
    container_name: bmi-app
    depends_on:
      - db
    environment:
      DISPLAY: host.docker.internal:0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: bmi_localization
      DB_USER: root
      DB_PASSWORD: Test12
    restart: on-failure

volumes:
  db_data: